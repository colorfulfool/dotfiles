# foot.ini — foot equivalent of ../kitty/.config/kitty/kitty.conf
# (dark/light/no-preference themes merged via foot's native
# [colors-dark]/[colors-light] sections; toggle at runtime with
# SIGUSR1/SIGUSR2 or the color-theme-toggle binding)

[main]
font=JetBrainsMono Nerd Font Mono:size=13
# kitty: window_padding_width 4 8 (vertical horizontal); foot pad is WIDTHxHEIGHT
pad=8x4
# kitty default (incl. no-preference) is the dark breeze theme
initial-color-theme=dark

[scrollback]
# kitty default is 2000 lines (foot default is 1000)
lines=2000

[bell]
# kitty: enable_audio_bell no
system=no

[colors-dark]
# base24-breeze inspired dark theme (kitty dark-theme.auto.conf)
foreground=eff0f1
background=191919
selection-foreground=eff0f1
selection-background=3daee9
# kitty: cursor #3daee9 + cursor_text_color background -> text cursor-bg
cursor=191919 3daee9
# kitty: url_color #3daee9
urls=3daee9
# kitty: background_opacity 0.95
alpha=0.95
# kitty: background_blur 16 — foot only toggles blur, radius is compositor-side
# (needs ext-background-effect-v1 blur support, e.g. a Hyprland layerrule)
blur=yes
regular0=31363b
regular1=c0392b
regular2=27ae60
regular3=fdbc4b
regular4=3daee9
regular5=8e44ad
regular6=16a085
regular7=eff0f1
bright0=7f8c8d
bright1=e74c3c
bright2=2ecc71
bright3=f67400
bright4=2980b9
bright5=9b59b6
bright6=1abc9c
bright7=fcfcfc

[colors-light]
# Konsole "Black on White" (kitty light-theme.auto.conf)
foreground=000000
background=ffffff
selection-foreground=000000
selection-background=d4d4d4
cursor=ffffff 000000
alpha=0.95
blur=yes
regular0=000000
regular1=b21818
regular2=0a7a0a
regular3=b26818
regular4=1818b2
regular5=b218b2
regular6=18b2b2
regular7=b2b2b2
bright0=686868
bright1=ff5454
bright2=28b028
bright3=ffff54
bright4=5454ff
bright5=ff54ff
bright6=34dfdf
bright7=ffffff

[key-bindings]
# foot has no tabs: both kitty bindings become "new window, same cwd"
# (cwd follows the shell's OSC 7 emission — needs a shell precmd hook)
# kitty: ctrl+shift+t new_tab_with_cwd / ctrl+shift+enter launch --cwd=current
spawn-terminal=Control+Shift+t Control+Shift+Return

# --- intentionally not ported ---
# text_composition_strategy: kitty-only text rendering tweak, no foot equivalent
# hide_window_decorations titlebar-only: foot prefers SSD by default, so on
#   Hyprland you get compositor borders and no titlebar already
# confirm_os_window_close 0: foot never prompts on close; behavior matches
# macos_option_as_alt: macOS-only; foot is Linux/Wayland-only
# tab_bar_style / tab_separator / tab_title_max_length + inactive_tab_background:
#   foot has no tabs (use zellij/tmux); active/inactive_border_color: no equivalent
# map super+t (unbind in kitty): foot has no Super+t default, nothing to clear
# commented-out ctrl+left/right word/line jumps: were commented in kitty too;
#   use shell readline bindings instead
