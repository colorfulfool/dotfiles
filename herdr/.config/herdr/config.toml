onboarding = false

[theme]
# name = "terminal"
auto_switch = true

[theme.custom.dark]
panel_bg = "#000000"
active_row_bg = "#313244" # Darker selected workspace / focused agent row on dark theme
selection_bg = "#585b70" # Must be brighter than active_row_bg

[theme.custom.light]
panel_bg = "#ffffff" # True white hex (NOT the ANSI "white" name, which is gray)
active_row_bg = "#d4d4d4" # Light grey row highlights visible on white background (#ffffff)
selection_bg = "#b2b2b2" # Must be darker than active_row_bg to stay visible as the cursor row

[terminal]
new_cwd = "follow"

[keys]
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

previous_agent = "alt+shift+up"
next_agent = "alt+shift+down"

previous_workspace = "alt+up"
next_workspace = "alt+down"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# prefix+shift+x deletes the worktree checkout (see [[keys.command]] below),
# so plain close-tab lives on prefix+alt+x
close_tab = "prefix+alt+x"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

# Delete active worktree checkout without TUI confirmation (bypasses
# "Delete worktree checkout..." prompt; --force also skips the dirty-tree
# second prompt and deletes modified/untracked files).
[[keys.command]]
key = "prefix+alt+d"
type = "shell"
command = "\"$HERDR_BIN_PATH\" worktree remove --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" --force"
description = "force delete worktree without confirmation"

# Shift+X deletes the checkout when the active workspace is a linked worktree,
# otherwise it closes the tab like the default close_tab binding did.
[[keys.command]]
key = "prefix+shift+x"
type = "shell"
command = "if \"$HERDR_BIN_PATH\" workspace get \"$HERDR_ACTIVE_WORKSPACE_ID\" 2>/dev/null | grep -q '\"is_linked_worktree\":true'; then \"$HERDR_BIN_PATH\" worktree remove --workspace \"$HERDR_ACTIVE_WORKSPACE_ID\" --force; else \"$HERDR_BIN_PATH\" tab close \"$HERDR_ACTIVE_TAB_ID\"; fi"
description = "delete worktree checkout, else close tab"
