onboarding = false

[theme]
# name = "terminal"
auto_switch = true

[theme.custom.dark]
panel_bg = "#000000"
active_row_bg = "#313244" # Darker selected workspace / focused agent row on dark theme
selection_bg = "#585b70" # Must be brighter than active_row_bg

[theme.custom.light]
panel_bg = "#ffffff" # True white hex (NOT the ANSI "white" name, which is gray)
active_row_bg = "#d4d4d4" # Light grey row highlights visible on white background (#ffffff)
selection_bg = "#b2b2b2" # Must be darker than active_row_bg to stay visible as the cursor row

[terminal]
new_cwd = "follow"

[keys]
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"

previous_agent = "alt+shift+up"
next_agent = "alt+shift+down"

previous_workspace = "alt+up"
next_workspace = "alt+down"
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
