# hyprpaper 0.8 config.
# The `wallpaper {}` block below is kept in sync by
# ~/.config/hypr/scripts/wallpaper.sh — every `next` fetch rewrites `path`
# here AND applies it live via IPC, so the current wallpaper survives both
# `hyprctl reload` (daemon keeps running) and login restarts (config re-read).
splash = false

wallpaper {
    monitor =
    path = /home/colorfulfool/dotfiles/nix/city.jpg
    fit_mode = cover
}
