# Konsole "Black on White" theme for Kitty
# Based on the original color scheme from KDE's Git repository [citation:9]
# Light-scheme recipe copied from omarchy themes (e.g. catppuccin-latte,
# white): secondary text slots hold the dark foreground instead of washed-out
# whites, a single muted gray serves as dim, and brights duplicate the normals
# (Konsole's neon brights were drawn for dark backgrounds and vanish on white).
# This is what keeps herdr space/agent names and inactive tabs readable.

foreground            #000000
background            #ffffff

# Black (VGA Black) - kept real black (omarchy maps this to background,
# but nothing here should silently turn black text invisible)
color0                #000000
# Red (herdr default / catppuccin latte red - needs attention)
color1                #d20f39
# Green (herdr default / catppuccin latte)
color2                #40a02b
# Yellow (herdr default / catppuccin latte yellow - working)
color3                #df8e1d
# Blue (Full RGB Blue)
color4                #1818b2
# Magenta -> mauve (herdr default / catppuccin latte mauve - branch labels)
color5                #8839ef
# Cyan -> teal (herdr default / catppuccin latte teal)
color6                #179299
# White = foreground: secondary/subdued text (agent names, inactive tabs)
color7                #000000

# Bright Black = the single muted gray (dim text)
color8                #686868
# Brights duplicate the normals (omarchy light recipe)
color9                #d20f39
color10               #40a02b
color11               #df8e1d
color12               #1818b2
color13               #8839ef
color14               #179299
# Bright White = foreground (never invisible on white)
color15               #000000

# Cursor and selection colors
cursor                #000000
cursor_text_color     #ffffff
selection_foreground  #000000
selection_background  #d4d4d4

inactive_tab_background #bbb

active_border_color   #000000
inactive_border_color #000000
