# Konsole "Black on White" theme for Kitty
# Based on the original color scheme from KDE's Git repository [citation:9]
# NOTE: Konsole's bright colors were drawn for dark backgrounds. On this white
# background several were unreadable (white/grey/yellow/cyan secondary text,
# e.g. herdr space + agent names and inactive tabs), so they are darkened below
# to >= ~4.5:1 contrast while keeping the original hues.

foreground            #000000
background            #ffffff

# Black (VGA Black)
color0                #000000
# Red (Full RGB Red)
color1                #b21818
# Green (Full RGB Green)
color2                #0a7a0a
# Yellow (Full RGB Yellow)
color3                #b26818
# Blue (Full RGB Blue)
color4                #1818b2
# Magenta (Full RGB Magenta)
color5                #b218b2
# Cyan (darkened: #18b2b2 was ~2.9:1 on white, unreadable as secondary text)
color6                #0b7d7d
# White (darkened: #b2b2b2 was ~1.9:1 on white; this is secondary/subdued text
# such as agent names and inactive tabs - kept dark for readability)
color7                #424242

# Bright Black (VGA Bright Black / Dark Gray)
color8                #686868
# Bright Red (darkened: #ff5454 was ~3:1 on white)
color9                #d32f2f
# Bright Green (darkened: #28b028 was ~3.4:1 on white)
color10               #1e8e1e
# Bright Yellow (darkened: #ffff54 was ~1.2:1 on white, invisible)
color11               #7a6400
# Bright Blue (Full RGB Blue - often rendered as bold)
color12               #5454ff
# Bright Magenta (darkened: #ff54ff was ~2.8:1 on white)
color13               #a800a8
# Bright Cyan (darkened: #34dfdf was ~1.7:1 on white, invisible)
color14               #007a7c
# Bright White (darkened: #ffffff was 1:1 on white, invisible;
# this is bright secondary text, kept lighter than color7 but readable)
color15               #565656

# Cursor and selection colors
cursor                #000000
cursor_text_color     #ffffff
selection_foreground  #000000
selection_background  #d4d4d4

inactive_tab_background #bbb

active_border_color   #000000
inactive_border_color #000000
