# User tool directories for the systemd user manager, so graphical-session
# services and Hyprland's exec commands see the same PATH as an interactive
# shell (Super+M and Super+Shift+R call `launch-or-focus` / `screenrecord` by
# name instead of a full path).
#
# This has to stand on its own on a plain Arch box: the PATH used to be
# injected by omarchy's env-bootstrap (/etc/profile.d/omarchy.sh ->
# /usr/share/omarchy/default/bash/env-bootstrap, plus
# /usr/share/uwsm/env.d/10-omarchy), which does not exist outside omarchy.
# The system directories are therefore listed explicitly as well, so a short
# or unset inherited PATH can't leave the user manager without /usr/bin.
PATH=${HOME}/.local/bin:${HOME}/.local/share/mise/shims:/usr/local/sbin:/usr/local/bin:/usr/bin:${PATH}
